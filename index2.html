<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortaleza amassado</title>
    <link rel="stylesheet" href="styles/style2.css" />
  </head>
  <body>
    <header class="cabecalho fade-in">
      <nav class="cabecalho__links">
        <a class="cabecalho__links_link" href="index.html">Home</a>
        <a class="cabecalho__links_link" href="index2.html">vozão</a>
        <a class="cabecalho__links_link" href="index3.html">Deu Match</a>
      </nav>
    </header>
    <main class="principal">
      <section class="principal__titulos">
        <div class="titulo__ceara fade-in">
          <img
            loading="lazy"
            class="titulo__ceara__img"
            src="assets/ceara-1.jpeg"
            alt="Vovô do Ceará SC"
          />
          <h1 class="titulo__ceara__texto">
            Vovozão mete o gato véi pra correr
          </h1>
          <img
            loading="lazy"
            class="titulo__ceara__img"
            src="assets/ceara-1.jpeg"
            alt="Vovô do Ceará SC"
          />
        </div>
        <div class="titulo__fortaleza fade-in">
          <img
            loading="lazy"
            class="titulo__fortaleza__img"
            src="assets/gato.jpeg"
            alt="Gato com juba de leão"
          />
          <h2 class="titulo__fortaleza__texto">
            Miau
            <span class="titulo__fortaleza__texto__destaque">Miau</span>
            Miau
            <span class="titulo__fortaleza__texto__destaque">Miau</span>
            Miau
          </h2>
          <img
            loading="lazy"
            class="titulo__fortaleza__img"
            src="assets/gato.jpeg"
            alt="Gato com juba de leão"
          />
        </div>
      </section>
      <section class="principal__conteudo">
        <video
          loading="lazy"
          class="principal__conteudo__video"
          src="assets/vovonadanca.mp4"
          controls
          loop
        >
          VOVÔ
        </video>
        <div class="principal__conteudo__fortaleza fade-in">
          <video
            loading="lazy"
            class="principal__conteudo__fortaleza__video"
            src="assets/byebyefortal.mp4"
            autoplay
            muted
            loop
          >
            ByeFortal
          </video>
          <video
            loading="lazy"
            class="principal__conteudo__fortaleza__video"
            src="assets/byebyefortal.mp4"
            autoplay
            muted
            loop
          >
            ByeFortal
          </video>
        </div>
        <div class="container-animation fade-in">
          <img
            loading="lazy"
            class="principal__conteudo__derrota"
            src="assets/derrotafortaleza4-0.jpg"
            alt="Placar 4 a 0 - Fortaleza perdeu para o Ceará"
          />
        </div>
        <div class="container-animation fade-in">
          <img
            loading="lazy"
            class="principal__conteudo__cdn"
            src="assets/haha.jpg"
            alt="Fortaleza não ganha do Ceará a 23 anos na copa do nordeste"
          />
        </div>
        <div class="container-animation fade-in">
          <img
            loading="lazy"
            class="principal__conteudo__derrota"
            src="assets/derrotafortaleza3-1.jpg"
            alt="Placar 3 a 1 - Fortaleza perdeu para o Ceará"
          />
        </div>
        <h2 class="principal__conteudo__titulo fade-in">Se ligou na tabela?</h2>
        <div class="container-animation fade-in">
          <img
            loading="lazy"
            class="principal__conteudo__tabela"
            src="assets/tabelabr.jpeg"
            alt="Tabela do Brasileirão"
          />
        </div>
        <div class="container-animation fade-in">
          <img loading="lazy" class="principal__conteudo__paulo" src="assets/souvozao.jpg" alt="Paulo no estilo torcedor do Ceará"/>
        </div>
        <h2 class="principal__conteudo__titulo fade-in">#SOUVOZÃO</h2>
      </section>
    </main>
    <footer class="rodape fade-in">Desenvolvido por Paulo Henrique Mendes - Torcedor Fiel do Ceará</footer>
    <script src="scripts/app2.js"></script>
